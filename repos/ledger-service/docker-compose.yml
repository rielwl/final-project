services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"

  ledger-service:
    build: .
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable"
    depends_on:
      - postgres
